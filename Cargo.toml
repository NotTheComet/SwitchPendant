[package]
name = "SwitchPendant"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = "0.37.0"
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30.0"
mavlink = { version = "0.20.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync"] }
roslibrust = { version = "0.26", features = ["rosbridge", "codegen"] }
roslibrust_codegen_macro = "0.26"
